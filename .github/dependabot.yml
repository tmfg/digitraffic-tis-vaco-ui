version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7 # Wait 7 days for any update
      semver-major-days: 14 # Wait 14 days for major version bumps
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Security fixes that are patch bumps: merge right away.
      # Minor and major security fixes are not grouped and open as individual PRs.
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "patch"
      # Must stay first among the version-update groups: a dependency goes to the first matching group.
      patches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
      # Minor updates. Major updates are not listed, so they open as individual PRs.
      dev-deps:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
      prod-deps:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
    ignore:
      # Keep @types/node on the Node runtime major (24)
      - dependency-name: "@types/node"
        update-types: [ "version-update:semver-major" ]
  # keep the pinned Node base image in the Dockerfile up to date
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    ignore:
      # Ignore updates to Node versions other than 24
      - dependency-name: "node"
        update-types: [ "version-update:semver-major" ]
  # keep used GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - "*"
